name: IDP CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python files
        run: |
          python -m py_compile app.py
          python -m py_compile config.py
          python -m py_compile database/database.py
          python -m py_compile preprocessing/image_processing.py
          python -m py_compile ocr/ocr.py
          python -m py_compile parser/parser.py
          python -m py_compile validation/validator.py
          python -m py_compile ml/predictor.py
          python -m py_compile reports/report.py
          python -m py_compile chatbot/chatbot.py

      - name: CI completed
        run: echo "IDP CI pipeline completed successfully!"