services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: idis, POSTGRES_PASSWORD: idis, POSTGRES_DB: idis}
    volumes: [pgdata:/var/lib/postgresql/data]
  web:
    build: {context: ., args: {WITH_PADDLE: "0"}}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://idis:idis@db:5432/idis
    ports: ["5000:5000"]
    depends_on: [db]
    volumes: [uploads:/app/uploads]
  mlflow:
    image: ghcr.io/mlflow/mlflow
    command: mlflow server --host 0.0.0.0 --port 5001
    ports: ["5001:5001"]
volumes: {pgdata: {}, uploads: {}}
